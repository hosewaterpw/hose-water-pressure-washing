[build]
  command = "npm run build"
  publish = ".next"

[[plugins]]
  package = "@netlify/plugin-nextjs"

[build.environment]
  NEXT_PRIVATE_TARGET = "server"

# Form success pages are served by the Next.js app (app/contact-success,
# app/estimate-success). They previously rewrote to static files in public/,
# which shadowed the real pages and could not carry their noindex metadata.

# No catch-all redirect here on purpose. @netlify/plugin-nextjs handles all
# routing itself; a "/* -> /index.html" rule would serve the homepage for every
# address on the site if it ever took effect.
